services:
  - type: web
    name: xingji-preview
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: HOST
        value: 0.0.0.0
      - key: LLM_MODEL_ID
        value: deepseek-v4-flash
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_TIMEOUT
        value: "180"
      - key: LLM_API_KEY
        sync: false
      - key: AMAP_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: UNSPLASH_SECRET_KEY
        sync: false
